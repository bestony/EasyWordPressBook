server {
    listen       80;
    server_name  localhost;

    # Preserve the old mdBook entry points after moving Legacy under /legacy/.
    location = /index.html {
        return 301 /legacy/index.html;
    }

    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location ~ ^/(deployment|i18n|opt|plugin|qa|theme)/(.+)\.html$ {
        return 301 /legacy/$1/$2.html;
    }

    location ~ ^/(basic-config|basic-plugin-1|basic-plugin-2|basic-usage|changelog|development-env|intro|optimize-1|optimize-2|optimize-3|optimize-4|readme|resources|security)\.html$ {
        return 301 /legacy/$1.html;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri.html $uri/ =404;
    }   
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
