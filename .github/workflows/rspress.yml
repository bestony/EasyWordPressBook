name: Build and deploy Rspress site

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with Rspress
        run: npm run build
      - name: Deploy to EdgeOne Pages
        env:
          EDGEONE_KEY: ${{ secrets.EDGEONE_KEY }}
        run: npx --yes edgeone pages deploy doc_build -n easywpbook -t "$EDGEONE_KEY"
