name: build & deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  
jobs:
  deploy:
    runs-on: ubuntu-20.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: install mdbook
        run: cargo install mdbook mdbook-linkcheck
      - name: Build with mdBook
        run: mdbook build
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'
      - name: Detect mdBook output directory
        run: |
          if [ -d "book/html" ]; then
            echo "EDGEONE_OUTPUT_DIR=book/html" >> "$GITHUB_ENV"
          else
            echo "EDGEONE_OUTPUT_DIR=book" >> "$GITHUB_ENV"
          fi
      - name: Deploy to EdgeOne Pages
        env:
          EDGEONE_KEY: ${{ secrets.EDGEONE_KEY }}
        run: npx --yes edgeone pages deploy "${{ env.EDGEONE_OUTPUT_DIR }}" -n easywpbook -t "$EDGEONE_KEY"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
              registry: ghcr.io
              username: ${{ github.repository_owner }}
              password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preset Image Name
        run: echo "IMAGE_URL=$(echo ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}:$(echo ${{ github.sha }} | cut -c1-7) | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - name: Preset MirrorName
        run: echo "MIRROR_URL=$(echo ghcr.mirror.ixiqin.com/${{ github.repository_owner }}/${{ github.event.repository.name }}:$(echo ${{ github.sha }} | cut -c1-7) | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
 
      - name: Build and push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_URL }}

      - name: Deploy Image to CapRrover
        uses: caprover/deploy-from-github@v1.1.2
        with:
          server: "${{ secrets.CAPROVER_SERVER }}"
          app: "${{ secrets.APP_NAME }}"
          token: "${{ secrets.APP_TOKEN }}"
          image: ${{ env.MIRROR_URL }}
